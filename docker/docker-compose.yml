name: my-ecommerce

# ── Reusable YAML anchors ─────────────────────────────────────────────────────
x-defaults: &defaults
  restart: unless-stopped
  networks:
    - ec_net

# Shared env block for all application services in the `full` profile.
# Values here are safe defaults for local dev — override with a root .env file.
# Secrets (JWT_SECRET, INTERNAL_SERVICE_TOKEN) should be set in .env.
x-app-env: &app-env
  NODE_ENV:               development
  DATABASE_URL:           postgresql://ecapp:ecapppassword@postgres:5432/ecommerce
  MONGODB_URL:            mongodb://${MONGO_USER:-ecuser}:${MONGO_PASSWORD:-ecpassword}@mongo:27017/ecommerce?authSource=admin
  REDIS_URL:              redis://:${REDIS_PASSWORD:-ecredis}@redis:6379
  JWT_SECRET:             ${JWT_SECRET:-dev-jwt-secret-that-is-at-least-32-chars!}
  INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-service-token-32chars!}
  AUTH_SERVICE_URL:       http://auth-service:3001
  PRODUCT_SERVICE_URL:    http://product-service:3002
  ORDER_SERVICE_URL:      http://order-service:3003
  PAYMENT_SERVICE_URL:    http://payment-service:3004
  PUBLIC_API_URL:         ${PUBLIC_API_URL:-http://localhost:3000}
  WEB_URL:                ${WEB_URL:-http://localhost:5173}
  ADMIN_URL:              ${ADMIN_URL:-http://localhost:5174}
  # Midtrans — safe sandbox placeholders for local dev
  MIDTRANS_SERVER_KEY:        ${MIDTRANS_SERVER_KEY:-SB-Mid-server-devplaceholderkey}
  MIDTRANS_IS_PRODUCTION:     "false"
  PUBLIC_MIDTRANS_CLIENT_KEY: ${PUBLIC_MIDTRANS_CLIENT_KEY:-SB-Mid-client-devplaceholderkey}
  # Mail — points to Mailpit (start with --profile tools to enable the UI)
  MAIL_HOST:         mailpit
  MAIL_PORT:         "1025"
  MAIL_USER:         dev
  MAIL_PASS:         dev
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@ecommerce.local}
  MAIL_FROM_NAME:    ${MAIL_FROM_NAME:-eCommerce Dev}

services:

  # ── Databases ─────────────────────────────────────────────────────────────
  # Started by default: pnpm infra:up

  postgres:
    <<: *defaults
    image: postgres:16-alpine
    container_name: ec_postgres
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-ecuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecpassword}
      POSTGRES_DB:       ${POSTGRES_DB:-ecommerce}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:         ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval:     5s
      timeout:      5s
      retries:      10
      start_period: 10s

  mongo:
    <<: *defaults
    image: mongo:7
    container_name: ec_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-ecuser}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-ecpassword}
      MONGO_INITDB_DATABASE:      ecommerce
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test:         ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval:     5s
      timeout:      10s
      retries:      10
      start_period: 15s

  redis:
    <<: *defaults
    image: redis:7-alpine
    container_name: ec_redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-ecredis}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:         ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-ecredis}", "--no-auth-warning", "ping"]
      interval:     5s
      timeout:      5s
      retries:      10
      start_period: 5s

  # ── Dev tooling (pnpm infra:tools) ───────────────────────────────────────
  # Starts Redis Commander, Mongo Express, and Mailpit for local inspection.

  redis-commander:
    <<: *defaults
    image: rediscommander/redis-commander:latest
    container_name: ec_redis_ui
    environment:
      REDIS_HOSTS: local:redis:6379:0:${REDIS_PASSWORD:-ecredis}
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["tools"]

  mongo-express:
    <<: *defaults
    image: mongo-express:1
    container_name: ec_mongo_ui
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER:-ecuser}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD:-ecpassword}
      ME_CONFIG_MONGODB_URL:           mongodb://${MONGO_USER:-ecuser}:${MONGO_PASSWORD:-ecpassword}@mongo:27017/
      ME_CONFIG_BASICAUTH:             "false"
    ports:
      - "8082:8081"
    depends_on:
      mongo:
        condition: service_healthy
    profiles: ["tools"]

  mailpit:
    <<: *defaults
    image: axllent/mailpit:latest
    container_name: ec_mailpit
    ports:
      - "1025:1025"   # SMTP (services point here)
      - "8025:8025"   # Web UI → http://localhost:8025
    healthcheck:
      test:     ["CMD", "wget", "-qO-", "http://localhost:8025/api/v1/info"]
      interval: 5s
      timeout:  3s
      retries:  5
    profiles: ["tools"]

  # ── Application services (pnpm infra:full) ────────────────────────────────
  # Builds all microservices from source and runs them in Docker.
  # Use this profile for integration testing or to verify a production-like stack.
  #
  # For active development with hot-reload: use `pnpm dev` (Turborepo) instead,
  # with only the infra services running (`pnpm infra:up`).
  #
  # Required secrets (must be set in a root .env file):
  #   JWT_SECRET             — min 32 chars, openssl rand -base64 48
  #   INTERNAL_SERVICE_TOKEN — min 32 chars, openssl rand -base64 48

  auth-service:
    <<: *defaults
    build:
      context:    ..
      dockerfile: docker/services/auth.Dockerfile
    container_name: ec_auth
    environment:
      <<: *app-env
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:         ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval:     10s
      timeout:      5s
      retries:      5
      start_period: 30s
    profiles: ["full"]

  product-service:
    <<: *defaults
    build:
      context:    ..
      dockerfile: docker/services/product.Dockerfile
    container_name: ec_product
    environment:
      <<: *app-env
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test:         ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval:     10s
      timeout:      5s
      retries:      5
      start_period: 30s
    profiles: ["full"]

  order-service:
    <<: *defaults
    build:
      context:    ..
      dockerfile: docker/services/order.Dockerfile
    container_name: ec_order
    environment:
      <<: *app-env
    ports:
      - "3003:3003"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:         ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval:     10s
      timeout:      5s
      retries:      5
      start_period: 30s
    profiles: ["full"]

  payment-service:
    <<: *defaults
    build:
      context:    ..
      dockerfile: docker/services/payment.Dockerfile
    container_name: ec_payment
    environment:
      <<: *app-env
    ports:
      - "3004:3004"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test:         ["CMD", "curl", "-f", "http://localhost:3004/health"]
      interval:     10s
      timeout:      5s
      retries:      5
      start_period: 30s
    profiles: ["full"]

  api-gateway:
    <<: *defaults
    build:
      context:    ..
      dockerfile: docker/services/api-gateway.Dockerfile
    container_name: ec_gateway
    environment:
      <<: *app-env
    ports:
      - "3000:3000"
    depends_on:
      auth-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    healthcheck:
      test:         ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval:     10s
      timeout:      5s
      retries:      5
      start_period: 30s
    profiles: ["full"]

  email-worker:
    <<: *defaults
    build:
      context:    ..
      dockerfile: docker/services/email-worker.Dockerfile
    container_name: ec_email_worker
    environment:
      <<: *app-env
    depends_on:
      mongo:
        condition: service_healthy
    profiles: ["full"]

# ── Networking ────────────────────────────────────────────────────────────────
networks:
  ec_net:
    name: ec_internal
    driver: bridge

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  mongo_data:
  redis_data:
