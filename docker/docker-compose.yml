name: my-ecommerce

services:

  # ── Databases ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ec_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-ecuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecpassword}
      POSTGRES_DB:       ${POSTGRES_DB:-ecommerce}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecuser}"]
      interval: 5s
      timeout:  5s
      retries:  5

  mongo:
    image: mongo:7
    container_name: ec_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-ecuser}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-ecpassword}
      MONGO_INITDB_DATABASE:      ecommerce
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo/init.js:/docker-entrypoint-initdb.d/init.js
    healthcheck:
      test:     ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout:  5s
      retries:  5

  redis:
    image: redis:7-alpine
    container_name: ec_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-ecredis}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:     ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-ecredis}", "ping"]
      interval: 5s
      timeout:  5s
      retries:  5

  # ── Dev tooling ───────────────────────────────────────────
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: ec_redis_ui
    restart: unless-stopped
    environment:
      REDIS_HOSTS:     local:redis:6379:0:${REDIS_PASSWORD:-ecredis}
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["tools"]

  mongo-express:
    image: mongo-express:latest
    container_name: ec_mongo_ui
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER:-ecuser}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD:-ecpassword}
      ME_CONFIG_MONGODB_URL:           mongodb://${MONGO_USER:-ecuser}:${MONGO_PASSWORD:-ecpassword}@mongo:27017/
      ME_CONFIG_BASICAUTH:             false
    ports:
      - "8082:8081"
    depends_on:
      mongo:
        condition: service_healthy
    profiles: ["tools"]

  mailpit:
    image: axllent/mailpit:latest
    container_name: ec_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    profiles: ["tools"]

volumes:
  postgres_data:
  mongo_data:
  redis_data:
